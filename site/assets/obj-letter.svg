.spark{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:spark 8s ease-in-out 3s infinite}
@keyframes spark{0%,70%,100%{opacity:0;transform:scale(.4)}78%{opacity:.9;transform:scale(1)}88%{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{opacity:.28}}
</style>
